# Recuenta las líneas de código en cada cambio del código y pone al día la
# sección «Código» del README (el pastel de Mermaid y la tabla) y la insignia
# .github/insignias/lineas.json. Ver herramientas/estadisticas_codigo.py.
#
# El commit lo hace github-actions con el GITHUB_TOKEN: GitHub no lanza otro
# workflow por él, así que no hay bucle.
name: Estadísticas del código

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.inc'
      - '**.py'
      - '**.sh'
      - 'Makefile'
      - '.gitattributes'
      - '.github/workflows/estadisticas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: true

jobs:
  contar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contar las líneas
        run: python3 herramientas/estadisticas_codigo.py

      - name: Subir el recuento si cambió
        run: |
          if git diff --quiet -- README.md .github/insignias/lineas.json; then
            echo "El recuento no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/insignias/lineas.json
          git commit -m "Estadísticas del código al día"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
